name: 云端小批量选票

on:
  workflow_dispatch:
    inputs:
      allow_network:
        description: "允许本轮获取公开日线行情"
        required: true
        type: boolean
        default: false
      tickers:
        description: "试运行股票，逗号分隔，最多30只，自动添加QQQ和SPY"
        required: true
        type: string
        default: "AA,AAPL,NBIS,MSFT,NVDA,AMD,TSLA,META"
  # 仅用于本次用户授权的首次接通，验收完成后移除推送触发。
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-run.yml"

permissions:
  contents: read

concurrency:
  group: mstock-cloud-run-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    name: 公开日线到中文报告
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      MSTOCK_RUN_ALLOW_NETWORK: ${{ github.event_name == 'push' || inputs.allow_network }}
      MSTOCK_RUN_TICKERS: ${{ inputs.tickers || 'AA,AAPL,NBIS,MSFT,NVDA,AMD,TSLA,META' }}
    steps:
      - name: 确认本轮联网授权
        run: |
          if ($env:MSTOCK_RUN_ALLOW_NETWORK -ne "true") {
            throw "请在运行入口勾选允许本轮获取公开日线行情。"
          }

      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: 安装Python与固定依赖
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12.4"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows-lock.txt

      - name: 恢复并检查依赖
        run: |
          python -m pip install -r requirements-windows-lock.txt
          if ($LASTEXITCODE -ne 0) { throw "依赖安装失败。" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "依赖检查失败。" }

      - name: 先运行新增边界测试
        run: |
          python -m pytest tests/test_cloud_run.py
          if ($LASTEXITCODE -ne 0) { throw "云端运行边界测试失败，未下载行情。" }

      - name: 获取公开行情并生成真实报告
        run: |
          python scripts/云端试运行.py --allow-network --tickers "$env:MSTOCK_RUN_TICKERS" --output-dir "$env:RUNNER_TEMP/Mstock-report"
          if ($LASTEXITCODE -ne 0) { throw "本轮选票未完成，请查看运行说明和失败清单。" }

      - name: 写入本轮摘要
        if: always()
        run: |
          $path = "$env:RUNNER_TEMP/Mstock-report/运行说明.md"
          if (Test-Path -LiteralPath $path) {
            Get-Content -LiteralPath $path -Raw -Encoding utf8 | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
          } else {
            "本轮尚未生成报告，请先检查授权、环境和测试步骤。" | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY
          }

      - name: 保存中文报告与验收记录
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Mstock-report
          path: ${{ runner.temp }}/Mstock-report/
          retention-days: 7
          if-no-files-found: warn
