name: 云端源码验收

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloud-check.yml"
      - "requirements*.txt"
      - "pytest.ini"
      - "src/**"
      - "scripts/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/cloud-check.yml"
      - "requirements*.txt"
      - "pytest.ini"
      - "src/**"
      - "scripts/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  validate:
    name: Windows 与 Python 3.12 离线业务验收
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: "1"
      MPLBACKEND: Agg
      MSTOCK_ENABLE_NETWORK: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: 获取当前源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 官方 v7.0.1
        with:
          persist-credentials: false

      - name: 安装迁移对应的 Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # 官方 v7.1.0
        with:
          python-version: "3.12.4"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows-lock.txt

      - name: 准备独立验收目录
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/Mstock-cloud-check" | Out-Null

      - name: 从公开软件源安装固定依赖
        id: dependencies
        run: |
          python -m pip install -r requirements-windows-lock.txt
          if ($LASTEXITCODE -ne 0) { throw "固定依赖安装失败，停止验收。" }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { throw "依赖一致性检查失败，停止验收。" }
          python -m pip freeze | Out-File -Encoding utf8 "$env:RUNNER_TEMP/Mstock-cloud-check/实际依赖.txt"

      - name: 编译源码
        run: |
          python -m compileall -q src scripts tests
          if ($LASTEXITCODE -ne 0) { throw "源码编译失败。" }

      - name: 使用隔离样本执行全部测试
        id: tests
        run: |
          python -m pytest --junitxml="$env:RUNNER_TEMP/Mstock-cloud-check/测试结果.xml"
          if ($LASTEXITCODE -ne 0) { throw "测试未全部通过，请查看测试结果和日志。" }

      - name: 写入中文验收摘要
        if: always()
        env:
          DEPENDENCY_RESULT: ${{ steps.dependencies.outcome }}
          TEST_RESULT: ${{ steps.tests.outcome }}
        run: |
          $directory = "$env:RUNNER_TEMP/Mstock-cloud-check"
          New-Item -ItemType Directory -Force $directory | Out-Null
          $lines = @(
            "## Mstock 云端源码验收",
            "",
            "- 运行版本：$env:GITHUB_SHA",
            "- 环境：GitHub 托管 Windows 2022，64 位 Python 3.12.4。",
            "- 依赖安装状态：$env:DEPENDENCY_RESULT",
            "- 测试状态：$env:TEST_RESULT",
            "- 数据：仅使用测试自建的隔离模拟样本；未恢复旧电脑真实数据。",
            "- 联网范围：获取源码、Python 和依赖；未调用行情下载或每日选票入口。",
            "- 本次结果不能代表真实候选、策略收益或新电脑现场恢复。"
          )
          $xmlPath = "$directory/测试结果.xml"
          if (Test-Path -LiteralPath $xmlPath) {
            [xml]$report = Get-Content -LiteralPath $xmlPath -Raw -Encoding utf8
            $suites = @($report.testsuites.testsuite)
            $total = ($suites | Measure-Object -Property tests -Sum).Sum
            $failures = ($suites | Measure-Object -Property failures -Sum).Sum
            $errors = ($suites | Measure-Object -Property errors -Sum).Sum
            $skipped = ($suites | Measure-Object -Property skipped -Sum).Sum
            $lines += "- 测试统计：共 $total 项，失败 $failures 项，错误 $errors 项，跳过 $skipped 项。"
          }
          $lines | Out-File -Encoding utf8 "$directory/云端验收说明.md"
          $lines | Out-File -Encoding utf8 -Append $env:GITHUB_STEP_SUMMARY

      - name: 保存验收记录
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # 官方 v7.0.2
        with:
          name: Mstock-cloud-check
          path: ${{ runner.temp }}/Mstock-cloud-check/
          retention-days: 7
          if-no-files-found: error
