默认数据源: yfinance
允许联网: false
股票池:
  类型:
    - 美股
    - ETF
  来源说明: 后续在用户允许联网后，通过公开合规数据源获取。
行情:
  频率: 日线
  复权方式: 后复权或数据源默认复权
  最小历史天数: 250
缓存:
  启用: true
  目录: data/cache
记录字段:
  - 数据来源
  - 获取时间
  - 数据频率
  - 缓存路径

独立存储股研究:
  默认启用: false
  允许联网: false
  韩股历史对照源: Naver公开历史OHLC
  韩股最近对照日期数: 20
  价格收益口径: 不计现金分红和汇率损益
  原始行情仅存临时目录: true
  说明: 仅在本轮用户授权及研究脚本显式联网参数下读取，不影响主候选流程。
