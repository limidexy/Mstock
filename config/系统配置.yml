项目名称: Mstock
默认语言: 简体中文
运行模式: 候选筛选
策略风格: 美股/ETF主升浪突破

功能边界:
  允许联网: false
  允许下载行情数据: false
  允许自动交易: false
  允许连接券商账户: false
  允许输出确定性买卖建议: false

目录:
  数据目录: data
  原始数据目录: data/raw
  处理数据目录: data/processed
  缓存目录: data/cache
  校对目录: data/review
  输出目录: data/output

运行参数:
  日志级别: INFO
  日期时区: Asia/Shanghai
  默认候选数量: 50
  默认市场基准:
    - QQQ
    - SPY
  默认行情周期: 日线

报表:
  默认输出格式:
    - CSV
    - HTML
  字段语言: 简体中文
  必须包含风险标签: true
  必须包含入选理由: true
  必须包含观察价: true
  必须包含失效位: true
  必须包含校对字段: true

校对:
  启用人工校对: true
  校对字段:
    - 我的校对
    - 我的备注
    - 是否加入观察池
    - 是否实际交易
    - 交易结果

风险提示: 本系统仅用于候选票筛选和复盘研究，不构成投资建议，不自动交易。
