评分版本: 主升浪突破规则版_v1
评分范围: 0-100
总分上限: 100
最低观察分: 65
最低强趋势分: 75
核心候选分: 85

评分项:
  趋势结构分:
    满分: 25
    说明: 判断均线多头排列、价格站上关键均线、短期均线向上发散等趋势结构。
  突破强度分:
    满分: 25
    说明: 判断是否突破或接近20日、60日、120日阶段新高，以及平台突破质量。
  量能强度分:
    满分: 15
    说明: 判断成交量、成交额、20日量比和放量突破状态。
  相对强度分:
    满分: 15
    说明: 判断标的相对QQQ和SPY是否更强。
  主升浪形态分:
    满分: 10
    说明: 判断是否具备主升浪加速、右侧突破、回踩后转强等截图偏好形态。

风险扣分:
  最多扣分: 20
  说明: 风险扣分单独列出，用于提醒人工复核，不代表确定性卖出建议。
  标签扣分:
    距离MA5过远: 4
    距离MA10过远: 4
    连续加速过热: 5
    长上影线: 4
    缩量冲高: 4
    盘后走弱: 3
    杠杆ETF风险: 6
    流动性不足: 5
    买卖价差可能偏大: 4
    高波动风险: 5

等级规则:
  A+:
    最低分: 85
    最高分: 100
    名称: 核心主升浪候选
  A:
    最低分: 75
    最高分: 84
    名称: 强趋势候选
  B:
    最低分: 65
    最高分: 74
    名称: 观察候选
  C:
    最低分: 50
    最高分: 64
    名称: 形态不完整
  D:
    最低分: 0
    最高分: 49
    名称: 不符合风格

入选理由:
  - 均线多头排列
  - 突破20日新高
  - 突破60日新高
  - 接近120日新高
  - 放量突破
  - 成交额放大
  - MACD红柱扩大
  - 强于QQQ
  - 强于SPY
  - 收盘接近日高
  - 主升浪加速
  - 平台突破
  - 回踩MA10后转强

输出要求:
  字段语言: 简体中文
  风险扣分单独展示: true
  杠杆ETF必须标记风险: true
  禁止自动交易: true
  禁止确定性买卖建议: true
